<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Atemoya Local LLM</title><style>body{font-family:-apple-system,sans-serif;background:#10141c;color:#eef2f7;max-width:900px;margin:auto;padding:20px}.muted{color:#9aa7b8}.card{background:#1b2431;border:1px solid #344154;border-radius:14px;padding:15px;margin:12px 0}.row{display:flex;justify-content:space-between;gap:12px}.pill{border-radius:99px;padding:4px 9px;font-size:12px}.running{background:#7c4dff}.complete{background:#148a5b}.error{background:#b93636}.queued{background:#637083}.bar{height:8px;background:#354256;border-radius:8px;overflow:hidden;margin:10px 0}.fill{height:100%;background:#4cc9f0}.small{font-size:13px;color:#b8c4d3;white-space:pre-wrap}h2{margin-top:24px}</style></head><body><h1>🧠 Atemoya Local LLM</h1><p class="muted">3초마다 갱신 · 현재 작업과 과거 기록을 분리해 표시합니다</p><div id="meta" class="card">연결 중…</div><h2>현재 작업</h2><div id="active"><div class="card">현재 실행 중인 작업이 없습니다.</div></div><h2>완료·오류 기록</h2><div id="history"></div><script>function card(x){return `<div class="card"><div class="row"><b>${x.task_name}</b><span class="pill ${x.status}">${x.status==='complete'?'완료':x.status==='error'?'오류':x.status==='running'?'실행 중':'대기'}</span></div><div class="small">${x.lane} · ${x.provider||'ollama-local'} / ${x.model} · ${x.current_step||''}</div><div class="bar"><div class="fill" style="width:${x.progress||0}%"></div></div><div class="small">${x.result_summary||x.error_summary||''}</div><div class="small">${x.finished_at?'완료: '+new Date(x.finished_at).toLocaleString('ko-KR'):x.started_at?'시작: '+new Date(x.started_at).toLocaleString('ko-KR'):''}</div></div>`}async function load(){try{const r=await fetch('local-llm-status.json?'+Date.now()),d=await r.json(),a=(d.runs||[]).filter(x=>['running','queued'].includes(x.status)),h=(d.runs||[]).filter(x=>['complete','error'].includes(x.status));document.getElementById('meta').innerHTML=`모델: <b>${d.model||'—'}</b> · 마지막 갱신: ${new Date(d.updated_at||Date.now()).toLocaleString('ko-KR')} · 현재 ${a.length}건 · 기록 ${h.length}건`;document.getElementById('active').innerHTML=a.length?a.map(card).join(''):'<div class="card">현재 실행 중인 작업이 없습니다.</div>';document.getElementById('history').innerHTML=h.length?h.map(card).join(''):'<div class="card">완료 기록이 없습니다.</div>'}catch(e){document.getElementById('meta').textContent='상태판 연결 대기: '+e.message}}load();setInterval(load,3000)</script></body></html>
