<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Atemoya Local LLM 실시간 작업판</title><style>body{font-family:-apple-system,BlinkMacSystemFont,sans-serif;background:#10141c;color:#eef2f7;max-width:900px;margin:0 auto;padding:24px}h1{margin-bottom:4px}.muted{color:#9aa7b8}.card{background:#1b2431;border:1px solid #344154;border-radius:14px;padding:16px;margin:14px 0}.row{display:flex;justify-content:space-between;gap:12px}.pill{border-radius:99px;padding:4px 10px;font-size:12px}.running{background:#7c4dff}.complete{background:#148a5b}.error{background:#b93636}.queued{background:#637083}.bar{height:8px;background:#354256;border-radius:8px;overflow:hidden;margin:12px 0}.fill{height:100%;background:#4cc9f0}.small{font-size:13px;color:#b8c4d3;white-space:pre-wrap}</style></head><body><h1>🧠 Atemoya Local LLM</h1><div class="muted">iMac에서 실행 중인 작업을 3초마다 새로 읽습니다 · 개인정보/비밀값 없음</div><div id="meta" class="card">상태 파일을 기다리는 중…</div><div id="list"></div><script>async function load(){try{const r=await fetch('local-llm-status.json?'+Date.now());const d=await r.json();document.getElementById('meta').innerHTML=`모델: <b>${d.model||'—'}</b> · 마지막 갱신: ${new Date(d.updated_at||Date.now()).toLocaleString('ko-KR')} · 전체 ${d.runs?.length||0}건`;document.getElementById('list').innerHTML=(d.runs||[]).map(x=>`<div class="card"><div class="row"><b>${x.task_name}</b><span class="pill ${x.status}">${x.status}</span></div><div class="small">${x.lane} · ${x.model} · ${x.current_step||''}</div><div class="bar"><div class="fill" style="width:${x.progress||0}%"></div></div><div class="small">${x.result_summary||x.error_summary||''}</div></div>`).join('')}catch(e){document.getElementById('meta').textContent='상태 파일 연결 대기: '+e.message}}load();setInterval(load,3000)</script></body></html>
