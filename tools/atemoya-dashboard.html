<!doctype html><html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Atemoya 운영 대시보드</title><style>:root{font-family:-apple-system,sans-serif;color:#edf3fb;background:#0c1118}body{max-width:1100px;margin:auto;padding:18px}.muted{color:#9aa9ba}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:10px}.card{background:#172131;border:1px solid #2b3a4e;border-radius:14px;padding:14px;margin:10px 0}.big{font-size:25px;font-weight:700}.ok{color:#50d890}.warn{color:#ffd166}.bad{color:#ff6b6b}.row{display:flex;justify-content:space-between;gap:12px}.pill{border-radius:99px;padding:3px 9px;background:#40516a;font-size:12px}.bar{height:8px;background:#334258;border-radius:8px;overflow:hidden;margin:9px 0}.fill{height:100%;background:#38bdf8}.small{font-size:13px;color:#b8c5d5;white-space:pre-wrap}table{width:100%;border-collapse:collapse;font-size:13px}td,th{text-align:left;padding:8px;border-bottom:1px solid #2b3a4e;vertical-align:top}a{color:#83c9ff}.scroll{overflow:auto}</style><body><h1>🧭 Atemoya 운영 대시보드</h1><div class="muted">iMac 로컬 운영판 · 5초 자동 갱신 · 실제 관찰값</div><div id="summary" class="grid"></div><h2>예약 작업과 다음 확인</h2><div id="jobs" class="card scroll"></div><h2>현재 작업 / 최근 결과</h2><div id="runs"></div><h2>최근 수집 근거 링크</h2><div id="sources" class="card scroll"></div><p id="foot" class="muted"></p><script>
const E=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const D=s=>s?new Date(s).toLocaleString('ko-KR'):'';const S=s=>s==='complete'?'완료':s==='error'?'오류':s==='running'?'실행 중':'대기';const C=s=>s==='complete'?'ok':s==='error'?'bad':s==='running'?'warn':'';
function rc(x){return `<div class="card"><div class="row"><b>${E(x.task_name)}</b><span class="pill ${C(x.status)}">${S(x.status)}</span></div><div class="small">${E(x.lane)} · ${E(x.provider||'ollama-local')} / ${E(x.model)} · ${E(x.current_step)}</div><div class="bar"><div class="fill" style="width:${Number(x.progress)||0}%"></div></div><div>${E(x.result_summary||x.error_summary||'')}</div><div class="small">${x.finished_at?'완료 '+D(x.finished_at):x.started_at?'시작 '+D(x.started_at):''} ${x.duration_ms?'· '+x.duration_ms+'ms':''}</div></div>`}
function render(d){let m=d.memory,o=d.ollama,n=d.n8n;summary.innerHTML=`<div class="card"><div class="muted">메모리 사용량</div><div class="big">${m.used_percent}%</div><div>${m.used_gb} GB / ${m.total_gb} GB</div><div class="bar"><div class="fill" style="width:${m.used_percent}%"></div></div></div><div class="card"><div class="muted">Ollama 로컬</div><div class="big ${o.ok?'ok':'bad'}">${o.ok?'정상':'오류'}</div><div>${E((o.running||[]).join(', ')||'현재 추론 없음')}</div></div><div class="card"><div class="muted">n8n</div><div class="big ${n.ok?'ok':'bad'}">${n.ok?'정상':'확인 필요'}</div><div>PostgreSQL 연결</div></div><div class="card"><div class="muted">현재 / 최근 기록</div><div class="big">${d.runs.filter(x=>['running','queued'].includes(x.status)).length} / ${d.runs.length}</div><div>최근 30건 기준</div></div>`;jobs.innerHTML='<table><tr><th>작업</th><th>주기</th><th>상태</th><th>실행</th><th>다음 확인</th><th>최근 로그</th></tr>'+d.jobs.map(j=>`<tr><td>${E(j.name)}<br><span class="small">${E(j.label)}</span></td><td>${E(j.schedule)}</td><td class="${j.registered?'ok':'bad'}">${j.registered?(j.state==='running'?'실행 중':'예약됨'):'미등록'}</td><td>${j.runs??'—'}</td><td>${E(j.next_hint)}</td><td>${E(j.last_log)}</td></tr>`).join('')+'</table>';let a=d.runs.filter(x=>['running','queued'].includes(x.status)),h=d.runs.filter(x=>!['running','queued'].includes(x.status));runs.innerHTML=(a.length?'<h3>현재 작업</h3>'+a.map(rc).join(''):'<div class="card">현재 실행 중인 작업 없음. 다음 예약 실행을 기다리는 정상 상태입니다.</div>')+'<h3>최근 결과</h3>'+h.slice(0,10).map(rc).join('');sources.innerHTML='<table><tr><th>채널</th><th>제목</th><th>근거 링크</th><th>수집 시각</th></tr>'+d.sources.map(s=>`<tr><td>${E(s.channel)}</td><td>${E(s.title)}</td><td>${s.url?`<a href="${E(s.url)}" target="_blank">열기</a>`:'—'}</td><td>${D(s.collected_at)}</td></tr>`).join('')+'</table>';foot.textContent='마지막 갱신 '+D(d.updated_at)+' · 메모리: macOS vm_stat · 작업/수집: PostgreSQL'}
async function load(){if(location.protocol==='file:'){summary.innerHTML='<div class="card bad"><b>파일로 열려 있어 실시간 연결이 막혀 있습니다.</b><br>아래 HTTP 주소로 열어 주세요:<br><a href="http://127.0.0.1:8765/atemoya-dashboard.html">iMac 주소</a><br><a href="http://100.102.120.59:8765/atemoya-dashboard.html">Tailscale 원격 주소</a></div>';return}try{render(await (await fetch('/api/status?'+Date.now())).json())}catch(e){summary.innerHTML='<div class="card bad">대시보드 연결 오류: '+E(e.message)+'</div>'}}load();setInterval(load,5000)</script></body></html>
