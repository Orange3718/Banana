<!doctype html>
<html lang="ko">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>LED 마스크 구매 전 체크</title>
<style>
html,body{margin:0;background:#111;color:#fff;font-family:system-ui,sans-serif}body{display:grid;place-items:center;min-height:100vh}.reel{width:min(100vw,420px);height:min(177.78vw,747px);max-height:100vh;overflow:hidden;position:relative;background:linear-gradient(145deg,#241443,#0c172f)}.scene{position:absolute;inset:0;padding:14vh 9vw 8vh;display:grid;align-content:center;gap:24px;opacity:0;animation:show 25s infinite}.scene:nth-child(1){animation-delay:0s}.scene:nth-child(2){animation-delay:5s}.scene:nth-child(3){animation-delay:10s}.scene:nth-child(4){animation-delay:15s}.scene:nth-child(5){animation-delay:20s}@keyframes show{0%,19%{opacity:0;transform:translateY(16px)}3%,16%{opacity:1;transform:none}20%,100%{opacity:0}}.tag{color:#d5b8ff;font-size:14px;font-weight:700}.big{font-size:clamp(32px,8vw,48px);font-weight:800;line-height:1.12}.small{font-size:19px;line-height:1.5;color:#ddd}.check{font-size:70px}.cta{position:absolute;bottom:5vh;left:9vw;right:9vw;padding:16px;border-radius:12px;background:#8b5cf6;text-align:center;color:white;text-decoration:none;font-weight:800}
</style>
<main class="reel">
  <section class="scene"><div class="tag">LED 마스크 구매 전</div><div class="check">01</div><div class="big">가격보다<br>먼저 볼 것</div><div class="small">2만원대부터 70만원대까지<br>조건을 같은 표에 놓습니다.</div></section>
  <section class="scene"><div class="tag">CHECK 02</div><div class="check">⏱️</div><div class="big">권장<br>사용 시간</div><div class="small">판매 페이지와 설명서의<br>사용 시간·타이머를 확인하세요.</div></section>
  <section class="scene"><div class="tag">CHECK 03</div><div class="check">👁️</div><div class="big">눈 보호와<br>주의사항</div><div class="small">제조사가 안내한 사용 조건을<br>먼저 읽습니다.</div></section>
  <section class="scene"><div class="tag">CHECK 04</div><div class="check">⚖️</div><div class="big">무게·충전·<br>착용감</div><div class="small">매일 사용할 수 있는 구조인지<br>상세페이지에서 비교합니다.</div></section>
  <section class="scene"><div class="tag">CHECK 05</div><div class="check">🧾</div><div class="big">A/S와<br>반품 조건</div><div class="small">효능 표현보다 구매 후 조건을<br>먼저 확인하세요.</div></section>
  <a class="cta" href="https://orange3718.github.io/Banana/offers/led-mask-checklist.html">전체 체크리스트 보기 →</a>
</main>
</html>
