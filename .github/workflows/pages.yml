name: Deploy static site to Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Build and verify content
        run: |
          node scripts/build-stories.mjs
          node scripts/build-beginner-guides.mjs
          node scripts/build-guide-channel-drafts.mjs
          node scripts/build-sitemap.mjs
          node scripts/audit-content-quality.mjs
          node scripts/test-channel-drafts.mjs
          node scripts/test-site.mjs
          node scripts/test-no-coupang.mjs
          node --test scripts/test-analytics.mjs scripts/test-public-package.mjs
      - name: Connect analytics accounts
        env:
          ATEMOYA_GA_ID: ${{ vars.ATEMOYA_GA_ID }}
          ATEMOYA_ADSENSE_CLIENT: ${{ vars.ATEMOYA_ADSENSE_CLIENT }}
          ATEMOYA_CONTACT_EMAIL: ${{ vars.ATEMOYA_CONTACT_EMAIL }}
          ATEMOYA_GOOGLE_VERIFY: ${{ vars.ATEMOYA_GOOGLE_VERIFY }}
          ATEMOYA_NAVER_VERIFY: ${{ vars.ATEMOYA_NAVER_VERIFY }}
        run: node scripts/configure-site.mjs
      - name: Package and verify public-only release
        run: |
          node scripts/build-public.mjs
          node scripts/test-site.mjs dist-public
          node scripts/test-no-coupang.mjs dist-public
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: 'dist-public'
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
