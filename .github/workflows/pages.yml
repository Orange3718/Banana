name: Deploy static site to Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Connect revenue and analytics accounts
        env:
          ATEMOYA_AFFILIATE_URL: ${{ vars.ATEMOYA_AFFILIATE_URL }}
          ATEMOYA_GA_ID: ${{ vars.ATEMOYA_GA_ID }}
          ATEMOYA_ADSENSE_CLIENT: ${{ vars.ATEMOYA_ADSENSE_CLIENT }}
          ATEMOYA_CONTACT_EMAIL: ${{ vars.ATEMOYA_CONTACT_EMAIL }}
          ATEMOYA_GOOGLE_VERIFY: ${{ vars.ATEMOYA_GOOGLE_VERIFY }}
          ATEMOYA_NAVER_VERIFY: ${{ vars.ATEMOYA_NAVER_VERIFY }}
          AFFILIATE_HUMIDIFIER: ${{ vars.AFFILIATE_HUMIDIFIER }}
          AFFILIATE_HEATING: ${{ vars.AFFILIATE_HEATING }}
          AFFILIATE_PURIFIER: ${{ vars.AFFILIATE_PURIFIER }}
          AFFILIATE_DISPOSER: ${{ vars.AFFILIATE_DISPOSER }}
          AFFILIATE_ROBOT: ${{ vars.AFFILIATE_ROBOT }}
          AFFILIATE_BEAUTY: ${{ vars.AFFILIATE_BEAUTY }}
          AFFILIATE_FEEDER: ${{ vars.AFFILIATE_FEEDER }}
          AFFILIATE_LLM: ${{ vars.AFFILIATE_LLM }}
          AFFILIATE_TRAVEL: ${{ vars.AFFILIATE_TRAVEL }}
          AFFILIATE_BLACKFRIDAY: ${{ vars.AFFILIATE_BLACKFRIDAY }}
        run: node scripts/configure-site.mjs
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
